<!DOCTYPE html>

<head>

<title>Тонкие тела человека — 3D</title>
<style>
html,body{margin:0;background:#0b0d1a}
/* права колонка — два розділи-акордеони: «Тонкие тела человека» і «Движение в эфирных каналах» */
html body .tt3d .tt-aside{overflow:hidden;gap:10px}
.fl-acc{display:flex;flex-direction:column;min-height:0;flex:none}
.fl-acc.is-open{flex:1}
.fl-acc+.fl-acc{border-top:1px solid var(--line);padding-top:6px}
.tt3d .fl-acc-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:6px 2px 8px;
  cursor:pointer;color:var(--fg);text-align:left;font:600 26px/1.1 var(--display)}
.fl-acc-h::after{content:"";flex:none;width:10px;height:10px;margin-right:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.fl-acc.is-open>.fl-acc-h::after{transform:rotate(-135deg) translate(-2px,-2px)}
.fl-acc-h:hover::after{border-color:var(--fg)}
.fl-acc-h .fl-dot{width:9px;height:9px;border-radius:50%;background:var(--ether);box-shadow:0 0 10px var(--ether);flex:none;margin-left:auto;margin-right:4px}
.fl-acc-h .fl-dot.off{background:var(--muted);box-shadow:none}
.fl-acc-b{display:flex;flex-direction:column;gap:18px;padding:0 4px 6px 0;overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.fl-acc:not(.is-open)>.fl-acc-b{display:none}
.fl{display:flex;flex-direction:column;gap:10px;color:var(--fg);font-family:var(--body)}
.fl-card{background:var(--panel)!important;border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px!important}
.fl *{box-sizing:border-box}
/* астральне тіло: блок «Чакры (Стогны)» у списку «Элементы» (порядок зверху вниз по стовпчиках) */
html body .tt3d .tt-els.as-els{display:block}
.as-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--r,3),auto);grid-auto-flow:column;gap:4px 10px}
.as-block{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.as-head span{font-weight:600;color:var(--fg)}
.as-sub{margin:4px 0 0 0;padding-left:0;gap:4px 8px}
.as-sub .tt-el{font-size:12px;gap:6px}
.as-els .tt-tools{margin-top:8px}
.as-dir{display:flex;align-items:center;gap:10px;margin:6px 0 8px}
.as-dir-cap{font-size:12px;color:var(--muted,#9c9bb8);white-space:nowrap}
.as-seg{flex:1}
.fl-seg.as-seg button{font-size:12px;padding:4px 8px}
.fl-seg.as-seg button[aria-pressed="true"]{border-color:var(--astral,#7fb4ff);background:color-mix(in srgb,var(--astral,#7fb4ff) 14%,transparent)}
@media (max-width:420px){.as-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row}}
.fl-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fl-head h3{margin:0;font:600 20px/1.15 var(--display);color:var(--fg)}
.fl-x{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-size:12px}
.fl-x:hover{color:var(--fg);border-color:var(--muted)}
.fl-sec+.fl-sec{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fl-cap2{font-size:12px;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.fl-cap2 b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.fl-list{display:flex;flex-direction:column;gap:2px}
.fl-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;
  padding:7px 8px;color:var(--fg);font:500 13.5px/1.25 var(--body);cursor:pointer}
.fl-list button::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.fl-list button:hover{background:rgba(255,255,255,.03)}
.fl-list button[aria-pressed="true"]{border-color:var(--ether);background:color-mix(in srgb,var(--ether) 10%,var(--panel))}
.fl-list button[aria-pressed="true"]::before{border-color:var(--ether);background:var(--ether);box-shadow:0 0 10px var(--ether)}
.fl-sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 0 22px;padding-left:10px;border-left:1px solid var(--line)}
.fl-subt{margin:8px 8px 2px;font:500 13.5px/1.3 var(--body);color:var(--muted)}
.fl-list .fl-sub button{font-size:13px;padding:6px 8px}
.fl-seg{display:flex;gap:6px}
.fl-seg button{flex:1;min-width:0;font:500 13px/1.2 var(--body);color:var(--fg);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 8px;cursor:pointer}
.fl-seg button:hover{border-color:var(--muted)}
.fl-seg button[aria-pressed="true"]{border-color:var(--ether);background:color-mix(in srgb,var(--ether) 12%,var(--panel))}
html body .tt3d .fl input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--ether);background:none;border:0;padding:0}
.fl-sl+.fl-sl{margin-top:10px}
.fl-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:1px}
/* 14.11: у картках тонких тіл — лише назви, без описів */
html body .tt3d .tt-body h2+p{display:none}
/* 14.11: шрифт Montserrat */
html body .tt3d{--display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;--body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.005em}
/* 14.11 (15:00): усі шрифти — Montserrat (без засічок); заголовки трохи менші й щільніші */
html body .tt3d .fl-acc-h{font-size:21px;font-weight:600;letter-spacing:-.01em}
html body .tt3d .tt-body h2{font-size:17px;font-weight:600;letter-spacing:-.005em}
html body .tt3d .fl-onstage b{font:600 15px/1.25 var(--display);letter-spacing:-.005em}
@media (max-width:820px){html body .tt3d .fl-acc-h{font-size:19px}}
html body .tt3d h2,html body .tt3d .fl-acc-h{letter-spacing:.01em}
html body .tt3d .tt-label{letter-spacing:.22em;font-size:11px}
/* елементи — як кнопки-перемикачі: видно, що їх можна натискати */
html body .tt3d .tt-card summary{color:color-mix(in srgb,var(--c) 70%,var(--fg));text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600}
html body .tt3d .tt-card summary::after{content:"Настроить";order:1;margin-left:auto;margin-right:8px;text-transform:none;letter-spacing:.02em;font-weight:500;font-size:12px;color:var(--muted)}
html body .tt3d .tt-card details[open] summary::after{content:"нажмите, чтобы вкл / выкл"}
html body .tt3d .tt-card .tt-els,html body .tt3d .tt-card .as-grid{gap:5px 6px}
html body .tt3d .tt-card .tt-el{align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025);color:var(--muted);font-size:12px;line-height:1.25;hyphens:auto;overflow-wrap:anywhere;transition:border-color .15s,background .15s,color .15s,transform .1s;user-select:none}
html body .tt3d .tt-card .tt-el:hover{border-color:color-mix(in srgb,var(--c) 65%,var(--line));color:var(--fg);background:color-mix(in srgb,var(--c) 7%,transparent)}
html body .tt3d .tt-card .tt-el:active{transform:scale(.98)}
html body .tt3d .tt-card .tt-el:has(input:checked){color:var(--fg);border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 13%,transparent)}
html body .tt3d .tt-card .tt-el input{margin:0}
html body .tt3d .tt-card .as-head{margin-top:2px}
/* 14.11: тіло + «Элементы» — один блок (картка): спільна рамка, тонкий роздільник, елементи розкриваються всередині */
html body .tt3d .tt-bodies{gap:12px}
html body .tt3d .tt-card{gap:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;transition:border-color .2s,background .2s,box-shadow .2s}
html body .tt3d .tt-card:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
html body .tt3d .tt-card:has(.tt-body[aria-pressed="true"]){border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--panel));box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent),0 8px 24px -14px var(--c)}
html body .tt3d .tt-card .tt-body{border:0;border-radius:0;background:transparent;align-items:center;padding:14px 16px}
html body .tt3d .tt-card .tt-body[aria-pressed="true"]{background:transparent}
html body .tt3d .tt-card .tt-dot{margin-top:0}
html body .tt3d .tt-card .tt-state{margin-top:0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
html body .tt3d .tt-card .tt-body[aria-pressed="true"] .tt-state{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
html body .tt3d .tt-card details{padding:0;border-top:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
html body .tt3d .tt-card:has(.tt-body[aria-pressed="true"]) details{border-top-color:color-mix(in srgb,var(--c) 30%,var(--line))}
html body .tt3d .tt-card summary{display:flex;width:100%;box-sizing:border-box;justify-content:space-between;padding:9px 16px 9px 44px;font-size:12.5px;letter-spacing:.02em}
html body .tt3d .tt-card summary::before{order:2;margin-right:4px}
html body .tt3d .tt-card summary:hover{color:var(--fg);background:color-mix(in srgb,var(--c) 6%,transparent)}
html body .tt3d .tt-card details[open] summary{color:var(--fg)}
html body .tt3d .tt-card details>.tt-els,html body .tt3d .tt-card details>div{padding:4px 16px 14px 18px}
.fl-sls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fl-sls .fl-sl+.fl-sl{margin-top:0}
.fl-sls .fl-cap2{margin-bottom:2px}
html body .tt3d .tt-views .tt-slider{flex:0 0 100%;display:flex;align-items:center;gap:10px;margin:4px 0 0;padding:0}
html body .tt3d .tt-views .tt-slider label{white-space:nowrap;font-size:12px;margin:0;display:flex;gap:6px}
html body .tt3d .tt-views .tt-slider input{flex:0 1 260px;min-width:90px;margin:0}
html body .tt3d .tt-views .tt-slider .tt-hint{display:none}
.fl-route{margin-top:8px}
.fl-route summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;display:inline-flex;gap:6px;align-items:center}
.fl-route summary::-webkit-details-marker{display:none}
.fl-route summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.fl-route[open] summary::before{transform:rotate(45deg)}
.fl-route p{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.fl-foot{display:flex;gap:6px}
.fl>.fl-foot{margin-bottom:2px}
.fl-play,.fl-restart{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:8px 12px;cursor:pointer;
  font:500 13px/1.2 var(--body);color:var(--fg);white-space:nowrap;background:var(--panel);border:1px solid var(--line)}
.fl-play{flex:1;border-color:var(--ether);background:color-mix(in srgb,var(--ether) 12%,var(--panel))}
.fl-play[aria-pressed="false"]{border-color:var(--line);background:var(--panel)}
.fl-play:hover,.fl-restart:hover{border-color:var(--muted)}
.fl-restart span{color:var(--muted);font-size:15px;line-height:1}
.fl-ico{width:11px;height:12px;position:relative;flex:none;color:var(--ether)}
.fl-play[aria-pressed="true"] .fl-ico::before,.fl-play[aria-pressed="true"] .fl-ico::after{content:"";position:absolute;top:0;width:3.5px;height:12px;border-radius:1px;background:currentColor}
.fl-play[aria-pressed="true"] .fl-ico::before{left:1px}.fl-play[aria-pressed="true"] .fl-ico::after{right:1px}
.fl-play[aria-pressed="false"] .fl-ico::before{content:"";position:absolute;left:1px;top:0;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent currentColor}
/* подпись движения на сцене */
.fl-onstage{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);pointer-events:none;background:rgba(19,22,42,.82);
  border:1px solid var(--line);border-radius:12px;padding:7px 12px 8px}
.fl-onstage b{display:flex;align-items:center;gap:8px;font:600 19px/1.15 var(--display);color:var(--fg)}
.fl-onstage b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ether);box-shadow:0 0 10px var(--ether);flex:none}
.fl-onstage span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.fl-onstage[hidden]{display:none}
html body .tt3d .fl-onstage.fl-cap-out{position:static;max-width:none;margin:-8px 0 0;pointer-events:auto}
@media (max-width:820px){.tt3d .fl-acc-h{font-size:26px}html body .tt3d .tt-aside{overflow:visible}}
#flCapStage{display:none!important}
/* у iframe (Tilda): висота від висоти екрана сторінки Tilda (--pvh), а не від висоти самого iframe */
html.tt-embed .tt3d .tt-wrap{height:min(calc(var(--pvh,900px)*.88),860px)}
@media (max-width:820px){html.tt-embed .tt3d .tt-wrap{height:auto}html.tt-embed .tt3d .tt-stage{height:calc(var(--pvh,760px)*.62)}}
</style>

<body>
<div class="tt3d" data-base="./" data-model="tonkie_tela.glb"></div>

<template id="flTpl">
<div class="fl" id="flPanel">
  <div class="fl-foot">
    <button id="flOn" class="fl-play" aria-pressed="true"><span class="fl-ico" aria-hidden="true"></span><span id="flOnTxt">Движение: вкл</span></button>
    <button id="flRe" class="fl-restart" title="Начать сначала"><span aria-hidden="true">↺</span> Сначала</button>
  </div>
  <div class="fl-card">
    <div class="fl-sec">
      <p class="fl-cap2">Вариант волны</p>
      <div class="fl-seg" id="flVar">
        <button data-v="male" aria-pressed="true">Мужской</button>

      </div>
      <p id="flDesc" hidden></p>
    </div>
    <div class="fl-sec fl-sls">
      <div class="fl-sl"><p class="fl-cap2">Скорость</p><input id="flSpeed" type="range" min="0.10" max="0.30" step="0.01" value="0.20" aria-label="Скорость"><div class="fl-ends"><span>медленнее</span><span>быстрее</span></div></div>
      <div class="fl-sl"><p class="fl-cap2">Каналы без движения</p><input id="flIdle" type="range" min="0" max="1" step="0.05" value="1" aria-label="Каналы без движения"><div class="fl-ends"><span>вкл</span><span>выкл</span></div></div>
    </div>
    <div class="fl-sec">
      <div class="fl-list" id="flCirc" role="group" aria-label="Движение">
        <button data-v="arms" aria-pressed="true">Большой небесный круг с руками</button>
        <button data-v="big" aria-pressed="false">Большой небесный круг</button>
        <button data-v="small" aria-pressed="false">Малый небесный круг</button>
        <p class="fl-subt" id="flHaraT">Движение энергии Жи через печи Хары (наборной вариант)</p>
        <div class="fl-sub" id="flHara" role="group" aria-labelledby="flHaraT">
          <button data-v="hara3" aria-pressed="false">Верхняя печь Хары</button>
          <button data-v="hara2" aria-pressed="false">Средняя печь Хары</button>

</template>
<template id="flCapTpl"><div class="fl-onstage" id="flCap"><b id="flCapName">Большой небесный круг с руками</b><span id="flCapStage" hidden>Загрузка…</span></div></template>

<script>
// Модель: tonkie_tela.glb.gz (≈14 МБ, розпаковується в браузері); якщо браузер не вміє — звичайний tonkie_tela.glb (≈25 МБ)
(()=>{const of=window.fetch.bind(window);let p=null;
 const pct=v=>{const e=document.querySelector('.tt3d .tt-pct');if(e)e.textContent=v+'%';};
 const dl=url=>of(url).then(async r=>{if(!r.ok)throw new Error(url);const tot=+r.headers.get('Content-Length')||0;
   if(!r.body||!tot)return r.arrayBuffer();const rd=r.body.getReader(),ch=[];let n=0;
   for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);n+=value.length;pct(Math.min(99,Math.round(n/tot*100)));}
   const u=new Uint8Array(n);let o=0;ch.forEach(c=>{u.set(c,o);o+=c.length;});return u.buffer;});
 const isGlb=u=>u[0]===0x67&&u[1]===0x6c&&u[2]===0x54&&u[3]===0x46;
 const gz=()=>dl('tonkie_tela.glb.gz').then(buf=>{const u=new Uint8Array(buf);if(isGlb(u))return buf;
   if(!(u[0]===0x1f&&u[1]===0x8b)||typeof DecompressionStream==='undefined')throw new Error('gzip');
   return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();});
 const model=()=>p||(p=gz().catch(()=>dl('tonkie_tela.glb')));
 window.fetch=(input,init)=>{const url=typeof input==='string'?input:(input&&input.url)||'';
  if(/tonkie_tela\.glb(\?|$)/.test(url))return model().then(b=>new Response(b,{status:200,headers:{'Content-Type':'model/gltf-binary','Content-Length':String(b.byteLength)}}));
  return of(input,init);};
})();
// Вбудовування в Tilda через iframe: висота iframe підлаштовується під сторінку; висоту екрана передає сторінка Tilda (замість vh)
(()=>{if(window.self===window.top)return;const d=document.documentElement;d.classList.add('tt-embed');
 const send=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h>0)parent.postMessage({tt3dHeight:h},'*');};
 window.addEventListener('message',e=>{const v=e.data&&e.data.tt3dVh;if(v>0){d.style.setProperty('--pvh',v+'px');setTimeout(send,50);}});
 const go=()=>{if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);send();parent.postMessage({tt3dReady:1},'*');};
 if(document.body)go();else document.addEventListener('DOMContentLoaded',go);
 window.addEventListener('load',send);})();
</script>

<script>
// панель вставляється між моделлю і колонкою «Тонкие тела», підпис — на сцену
document.addEventListener('DOMContentLoaded',()=>{
  const mount=()=>{const wrap=document.querySelector('.tt3d .tt-wrap'),stage=wrap&&wrap.querySelector('.tt-stage');
    if(!stage){requestAnimationFrame(mount);return;}
    const aside=wrap.querySelector('.tt-aside'),h1=aside.querySelector('.tt-title');
    const sec=(title,id,open)=>{const el=document.createElement('section');el.className='fl-acc'+(open?' is-open':'');
      const h=document.createElement('button');h.type='button';h.className='fl-acc-h';h.id=id+'H';h.setAttribute('aria-expanded',open);h.setAttribute('aria-controls',id);
      h.append(document.createTextNode(title));const b=document.createElement('div');b.className='fl-acc-b';b.id=id;el.append(h,b);return el;};
    const s1=sec('Тонкие тела человека','flBodies',true),s2=sec('Движение в эфирных каналах','flMotion',false);
    [...aside.children].forEach(ch=>s1.lastChild.append(ch));if(h1)h1.remove();
    s2.lastChild.append(document.getElementById('flTpl').content.cloneNode(true));
    const dot=document.createElement('span');dot.className='fl-dot';dot.id='flDot';s2.firstChild.append(dot);
    aside.append(s1,s2);
    // кнопки «Показать все / Скрыть все» не потрібні
    {const ta=wrap.querySelector('.tt-all');if(ta&&ta.closest('.tt-row'))ta.closest('.tt-row').remove();}
    // «Плотность физического тела» — на сцену, одразу під рядком «Спереди / Сбоку / Сзади / Сверху / Вращение»
    {const sl=wrap.querySelector('.tt-slider'),vw=stage.querySelector('.tt-views');if(sl&&vw)vw.append(sl);}
    [s1,s2].forEach(x=>x.firstChild.onclick=()=>{const willOpen=!x.classList.contains('is-open');
      [s1,s2].forEach(y=>{const o=y===x?willOpen:false;y.classList.toggle('is-open',o);y.firstChild.setAttribute('aria-expanded',o);});
      window.flSetOn&&window.flSetOn(s2.classList.contains('is-open'));
      if(!s1.classList.contains('is-open')&&!s2.classList.contains('is-open')){}});
    stage.append(document.getElementById('flCapTpl').content.cloneNode(true));
    // на вузькому екрані (телефон) підпис руху — під сценою, щоб не закривав обличчя моделі
    {const cap=stage.querySelector('#flCap'),mq=matchMedia('(max-width:820px)');
     const place=()=>{if(mq.matches){cap.classList.add('fl-cap-out');stage.after(cap);}else{cap.classList.remove('fl-cap-out');stage.append(cap);}};
     place();mq.addEventListener?mq.addEventListener('change',place):mq.addListener(place);}
    wire();};
  mount();
});
function wire(){
  const S=window.FLOW_STATE,$=id=>document.getElementById(id);
  const DESC={big_male:'От точек выхода ног вверх по подъёмным каналам → соединение в низу таза → переднесрединный канал → через голову → заднесрединный канал → крестец → разделение на опускные каналы ног → к точкам выхода ног.',
    big_female:'Противоположно мужскому: от точек выхода ног вверх по опускным каналам → соединение в крестце → заднесрединный канал → через голову → переднесрединный канал → низ таза → разделение на подъёмные каналы ног → к точкам выхода ног.',
    arms_male:'Вверх по подъёмным каналам ног → низ таза → переднесрединный канал до точки пересечения на груди → три шарика: два уходят на руки — сначала по переднему каналу к ладоням, назад по заднему каналу и по спинному; один идёт через голову по заднесрединному → все три соединяются в крестце в один момент → опускные каналы ног.',
    arms_female:'Противоположно мужскому: вверх по опускным каналам → крестец → три шарика: два по спинному и заднему каналу к ладоням, назад по переднему каналу; один по заднесрединному через голову и вниз по переднесрединному → все три соединяются в точке пересечения на груди → переднесрединный канал → низ таза → подъёмные каналы ног.',
    small_male:'От низа таза (где соединяются каналы ног) вверх по переднесрединному каналу → через голову → по заднесрединному каналу → до крестца.',
    small_female:'Противоположно мужскому: от крестца вверх по заднесрединному каналу → через голову → вниз по переднесрединному каналу → до низа таза.'};
  const HD={1:['Нижняя печь: от точек выхода ног вверх по опускным (задним) каналам → крестец → внутрь нижней печи → из точки её касания с переднесрединным каналом вниз → низ таза → подъёмные каналы ног → в стопы.','Нижняя печь (обратно): вверх по подъёмным каналам ног → низ таза → переднесрединный канал → внутрь нижней печи → крестец → опускные каналы ног → в стопы.'],
    2:['Средняя печь: вверх по опускным каналам ног → крестец → по позвоночнику до средней печи → внутрь печи → из точки касания с переднесрединным каналом вниз → низ таза → подъёмные каналы → в стопы.','Средняя печь (обратно): вверх по подъёмным каналам и переднесрединному каналу → внутрь средней печи → по позвоночнику вниз → крестец → опускные каналы → в стопы.'],
    3:['Верхняя печь: вверх по опускным каналам ног → крестец → по позвоночнику до затылка → внутрь верхней печи → ко лбу → через голову → переднесрединный канал вниз → в стопы.','Верхняя печь (обратно): вверх по подъёмным каналам и переднесрединному каналу → через голову ко лбу → внутрь верхней печи → по позвоночнику вниз → крестец → опускные каналы → в стопы.']};
  // печі Хары — лише один (наборной) варіант: перемикач «Вариант волны» ховається
  function sum(){{const vs=$('flVar').closest('.fl-sec');if(vs)vs.style.display=/^hara/.test(S.circuit)?'none':'';}
    const m=/^hara(\d)$/.exec(S.circuit);if(m){$('flDesc').textContent=HD[+m[1]][S.variant==='female'?1:0];}
    else $('flDesc').textContent=DESC[S.circuit+'_'+S.variant];}

  const seg=(id,key)=>$(id).querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{S[key]=b.dataset.v;$(id).querySelectorAll('button[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));window.FLOW&&FLOW.restart();sum();});
  seg('flCirc','circuit');seg('flVar','variant');
  $('flIdle').oninput=e=>{S.idle=+e.target.value;};
  $('flSpeed').oninput=e=>{S.speed=+e.target.value;sum();};
  const setOn=on=>{S.on=on;$('flOn').setAttribute('aria-pressed',on);$('flOnTxt').textContent=on?'Движение: вкл':'Движение: выкл';$('flDot').classList.toggle('off',!on);$('flCap').hidden=!on;};
  let savedBodies=null;
  window.flSetOn=on=>{const bodies=[...document.querySelectorAll('.tt-body')];
    if(on){savedBodies=bodies.map(b=>b.getAttribute('aria-pressed')==='true');bodies.forEach(b=>{if(b.getAttribute('aria-pressed')==='true')b.click();});}   // рух: усі тонкі тіла вимкнені
    // назад до «Тонких тел»: рух зупинено, канали руху вимкнені; тонкі тіла лишаються вимкненими — користувач вмикає потрібні сам
    setOn(on);};$('flOn').onclick=()=>setOn(!S.on);
  setOn(false); // спочатку відкриті «Тонкие тела» — рух вимкнено
  $('flRe').onclick=()=>window.FLOW&&FLOW.restart();
  sum();
}
</script>
</body>
</html>
